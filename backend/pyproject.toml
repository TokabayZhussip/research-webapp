[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Tokabay", email = "330029439+TokabayZhussip@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

   [tool.uv]
   package = false

   [tool.pytest.ini_options]
   pythonpath = ["."]

   [tool.ruff]
   line-length = 100
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
